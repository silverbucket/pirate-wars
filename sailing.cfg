# Sailing tunables — edit without recompiling Go.
tick_ms=250
hull_speed=0.55

# Wind drifts to a new 8-way facing every N ticks.
wind_drift_ticks=100
wind_strength_min=1
wind_strength_max=3

# Wind strength factors (strength 0 = calm/no wind in code).
wind_factor_light=0.55
wind_factor_fresh=1.0
wind_factor_strong=1.25

# NPCs skip movement resolution this percent of ticks (0 = wind-only throttle).
npc_skip_percent=0

# Point-of-sail multipliers (hull speed × sail × point-of-sail × wind factor, accumulated per tick).
point_of_sail_run=1.0
point_of_sail_broad=0.9
point_of_sail_beam=0.75
point_of_sail_close=0.4
point_of_sail_irons=0.05

# Sail setting multipliers.
sail_full=1.0
sail_half=0.5
sail_furled=0.0

<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" width="512" height="512">
  <title>Pirate Wars</title>
  <desc>Jolly Roger: a bone-white skull over crossed bones on a black roundel.</desc>
  <defs>
    <!-- One horizontal bone centred on the origin; used twice, rotated. -->
    <g id="bone">
      <line x1="-150" y1="0" x2="150" y2="0" stroke="#f4efe2" stroke-width="36" stroke-linecap="round"/>
      <circle cx="-150" cy="-20" r="24" fill="#f4efe2"/>
      <circle cx="-150" cy="20" r="24" fill="#f4efe2"/>
      <circle cx="150" cy="-20" r="24" fill="#f4efe2"/>
      <circle cx="150" cy="20" r="24" fill="#f4efe2"/>
    </g>
  </defs>

  <!-- Flag -->
  <circle cx="256" cy="256" r="252" fill="#141414"/>

  <!-- Crossed bones: the X sits just under the jaw, ends peek out past the cheeks -->
  <use xlink:href="#bone" href="#bone" transform="translate(256 352) rotate(32)"/>
  <use xlink:href="#bone" href="#bone" transform="translate(256 352) rotate(-32)"/>

  <!-- Skull, centred on the vertical axis above the crossing -->
  <g fill="#f4efe2">
    <circle cx="256" cy="178" r="106"/>
    <rect x="206" y="246" width="100" height="76" rx="22"/>
  </g>

  <!-- Face, cut in the flag colour -->
  <g fill="#141414">
    <ellipse cx="218" cy="184" rx="32" ry="38" transform="rotate(-12 218 184)"/>
    <ellipse cx="294" cy="184" rx="32" ry="38" transform="rotate(12 294 184)"/>
    <path d="M256 216 L240 250 Q256 259 272 250 Z"/>
  </g>
  <g stroke="#141414" stroke-width="8" stroke-linecap="round">
    <line x1="229" y1="282" x2="229" y2="314"/>
    <line x1="247" y1="282" x2="247" y2="314"/>
    <line x1="265" y1="282" x2="265" y2="314"/>
    <line x1="283" y1="282" x2="283" y2="314"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" width="512" height="512">
  <title>Pirate Wars</title>
  <desc>A Jolly Roger in the splash screen's palette: an ink-drawn skull in a slate bandana over crossed bones, on aged parchment.</desc>
  <defs>
    <radialGradient id="parchment" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#f4e8c9"/>
      <stop offset="0.65" stop-color="#e7d3a3"/>
      <stop offset="1" stop-color="#c8a86c"/>
    </radialGradient>
    <linearGradient id="bone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf3e0"/>
      <stop offset="1" stop-color="#e6d3a6"/>
    </linearGradient>
    <radialGradient id="socket" cx="0.5" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#0f0804"/>
      <stop offset="1" stop-color="#3a2412"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="1" height="1">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7"/>
      <feColorMatrix values="0 0 0 0 0.35  0 0 0 0 0.25  0 0 0 0 0.12  0 0 0 0.22 0"/>
    </filter>
    <clipPath id="disc"><circle cx="256" cy="256" r="252"/></clipPath>
    <!-- one femur, horizontal, centred on the origin: head and neck on the left, condyles on the right,
         shaft pinched toward the middle. Shaded across the shaft so it reads as a cylinder. -->
    <linearGradient id="shaft" gradientUnits="userSpaceOnUse" x1="0" y1="-36" x2="0" y2="36">
      <stop offset="0" stop-color="#f6ecd3"/>
      <stop offset="0.55" stop-color="#e9d8ad"/>
      <stop offset="1" stop-color="#cfb27c"/>
    </linearGradient>
    <g id="femur">
      <path fill="url(#shaft)" stroke="#4a2f18" stroke-width="5" stroke-linejoin="round" d="
        M-128 -14 C-80 -9 80 -9 128 -14
        C136 -30 158 -36 168 -22 C176 -8 164 4 152 2
        C166 8 172 28 156 34 C142 38 132 26 128 14
        C80 9 -80 9 -128 14
        C-134 28 -150 38 -162 32 C-174 24 -166 6 -152 2
        C-168 -2 -182 -20 -170 -34 C-158 -44 -136 -32 -128 -14 Z"/>
      <path fill="none" stroke="#fbf5e6" stroke-width="2.2" stroke-linecap="round" opacity="0.9" d="M-112 -5 C-70 -1 70 -1 112 -5"/>
      <path fill="none" stroke="#4a2f18" stroke-width="2.2" stroke-linecap="round" opacity="0.5" d="M-140 16 L-130 22 M146 12 L138 20"/>
    </g>
    <path id="skull" d="M256 76 C320 76 372 110 384 168 C390 200 380 222 372 234 C380 244 384 262 378 278 C372 292 360 300 344 300 C336 312 330 326 324 340 L322 378 C322 400 300 416 256 416 C212 416 190 400 190 378 L188 340 C182 326 176 312 168 300 C152 300 140 292 134 278 C128 262 132 244 140 234 C132 222 122 200 128 168 C140 110 192 76 256 76 Z"/>
    <clipPath id="jaw"><use xlink:href="#skull" href="#skull"/></clipPath>
  </defs>

  <!-- parchment roundel -->
  <circle cx="256" cy="256" r="252" fill="url(#parchment)"/>
  <rect width="512" height="512" filter="url(#grain)" clip-path="url(#disc)"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="#4b4a68" stroke-width="14"/>
  <circle cx="256" cy="256" r="225" fill="none" stroke="#c98f2a" stroke-width="3"/>

  <g transform="translate(256 264.8) scale(0.876) translate(-256 -256)" stroke="#4a2f18" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
    <!-- crossed femurs, mirrored about the axis and crossing behind the skull's centre -->
    <use xlink:href="#femur" href="#femur" transform="translate(256 246) rotate(40) scale(1.35)"/>
    <use xlink:href="#femur" href="#femur" transform="translate(256 246) scale(-1 1) rotate(40) scale(1.35)"/>

    <!-- cranium, cheekbones, maxilla and mandible in one outline -->
    <use xlink:href="#skull" href="#skull" fill="url(#bone)"/>
    <!-- tonal shading: temporal fossae and under the zygomatic arches -->
    <g fill="#c9ad74" stroke="none" opacity="0.55">
      <path d="M372 234 C380 244 384 262 378 278 C372 292 360 300 344 300 C350 280 358 254 352 232 Z"/><path d="M 140 234 C 132 244 128 262 134 278 C 140 292 152 300 168 300 C 162 280 154 254 160 232 Z"/>
      <path d="M344 300 C336 312 330 326 324 340 L298 340 C306 322 320 306 344 300 Z"/><path d="M 168 300 C 176 312 182 326 188 340 L 214 340 C 206 322 192 306 168 300 Z"/>
    </g>
    <!-- a crack in the left maxilla -->
    <path fill="none" stroke-width="4" d="M176 300 L190 310 L182 324 L196 336"/>

    <!-- orbits and nasal aperture -->
    <g fill="url(#socket)" stroke-width="4">
      <path d="M272 214 C300 200 340 204 352 224 C358 250 340 284 306 286 C282 286 270 262 272 240 Z"/>
      <path d="M 240 214 C 212 200 172 204 160 224 C 154 250 172 284 206 286 C 230 286 242 262 240 240 Z"/>
      <path d="M256 262 C250 280 234 296 234 312 C234 326 246 330 256 320 C266 330 278 326 278 312 C278 296 262 280 256 262 Z"/>
    </g>

    <!-- teeth: a dark gum band, then each tooth cut separately -->
    <rect x="180" y="338" width="152" height="60" fill="#2b1a0c" stroke="none" clip-path="url(#jaw)"/>
    <g fill="#f6eddb" stroke-width="3">
      <path d="M256 340 L270 340 L270 366 Q270 372 263.0 372 Q256 372 256 366 Z"/>
      <path d="M 256 340 L 242 340 L 242 366 Q 242 372 249 372 Q 256 372 256 366 Z"/>
      <path d="M272 340 L283 340 L283 366 Q283 372 277.5 372 Q272 372 272 366 Z"/>
      <path d="M 240 340 L 229 340 L 229 366 Q 229 372 234.5 372 Q 240 372 240 366 Z"/>
      <path d="M285 340 L296 340 L296 368 L290.5 381 L285 368 Z"/>
      <path d="M 227 340 L 216 340 L 216 368 L 221.5 381 L 227 368 Z"/>
      <path d="M298 340 L307 340 L307 360 Q307 366 302.5 366 Q298 366 298 360 Z"/>
      <path d="M 214 340 L 205 340 L 205 360 Q 205 366 209.5 366 Q 214 366 214 360 Z"/>
      <path d="M309 340 L318 340 L318 360 Q318 366 313.5 366 Q309 366 309 360 Z"/>
      <path d="M 203 340 L 194 340 L 194 360 Q 194 366 198.5 366 Q 203 366 203 360 Z"/>
      <path d="M256 396 L256 386 Q256 382 261.0 382 Q266 382 266 386 L266 396 Z"/>
      <path d="M 256 396 L 256 386 Q 256 382 251 382 Q 246 382 246 386 L 246 396 Z"/>
      <path d="M268 396 L268 386 Q268 382 272.5 382 Q277 382 277 386 L277 396 Z"/>
      <path d="M 244 396 L 244 386 Q 244 382 239.5 382 Q 235 382 235 386 L 235 396 Z"/>
      <path d="M279 396 L279 386 Q279 382 283.5 382 Q288 382 288 386 L288 396 Z"/>
      <path d="M 233 396 L 233 386 Q 233 382 228.5 382 Q 224 382 224 386 L 224 396 Z"/>
      <path d="M290 396 L290 386 Q290 382 294.0 382 Q298 382 298 386 L298 396 Z"/>
      <path d="M 222 396 L 222 386 Q 222 382 218 382 Q 214 382 214 386 L 214 396 Z"/>
      <path d="M300 396 L300 386 Q300 382 304.0 382 Q308 382 308 386 L308 396 Z"/>
      <path d="M 212 396 L 212 386 Q 212 382 208 382 Q 204 382 204 386 L 204 396 Z"/>
    </g>

    <!-- slate bandana: follows the dome, folds, ochre trim, knot and tails at the right temple -->
    <path fill="#4b4a68" d="M128 200 C128 120 180 76 256 76 C332 76 384 120 384 200 C356 186 308 180 256 180 C204 180 156 186 128 200 Z"/>
    <path fill="none" stroke="#3a3952" stroke-width="4" d="M150 156 C190 132 240 126 300 134 M142 178 C200 160 280 156 352 168"/>
    <path fill="none" stroke="#d9a83e" stroke-width="5" d="M134 194 C162 180 208 174 256 174 C304 174 350 180 378 194"/>
    <path fill="#4b4a68" d="M382 190 C410 176 432 182 448 170 C436 196 418 206 400 212 Z"/>
    <path fill="#4b4a68" d="M386 202 C410 206 428 224 446 222 C428 236 410 234 394 222 Z"/>
    <circle cx="386" cy="198" r="15" fill="#4b4a68"/>

    <!-- gold hoop earring -->
    <circle cx="124" cy="286" r="13" fill="none" stroke="#d9a83e" stroke-width="6"/>
  </g>
</svg>

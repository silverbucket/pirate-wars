<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" width="512" height="512">
  <title>Pirate Wars</title>
  <desc>Jolly Roger: a bone-white skull over crossed bones on a black roundel.</desc>
  <defs>
    <!-- One horizontal bone centred on the origin; used twice, rotated. -->
    <g id="bone">
      <line x1="-165" y1="0" x2="165" y2="0" stroke="#f4efe2" stroke-width="38" stroke-linecap="round"/>
      <circle cx="-165" cy="-21" r="25" fill="#f4efe2"/>
      <circle cx="-165" cy="21" r="25" fill="#f4efe2"/>
      <circle cx="165" cy="-21" r="25" fill="#f4efe2"/>
      <circle cx="165" cy="21" r="25" fill="#f4efe2"/>
    </g>
  </defs>

  <!-- Flag -->
  <circle cx="256" cy="256" r="252" fill="#141414"/>

  <!-- Crossed bones, behind the skull -->
  <use xlink:href="#bone" href="#bone" transform="translate(256 300) rotate(40)"/>
  <use xlink:href="#bone" href="#bone" transform="translate(256 300) rotate(-40)"/>

  <!-- Skull -->
  <g fill="#f4efe2">
    <circle cx="256" cy="226" r="122"/>
    <rect x="194" y="290" width="124" height="96" rx="22"/>
  </g>

  <!-- Face, cut in the flag colour -->
  <g fill="#141414">
    <ellipse cx="212" cy="232" rx="36" ry="42" transform="rotate(-12 212 232)"/>
    <ellipse cx="300" cy="232" rx="36" ry="42" transform="rotate(12 300 232)"/>
    <path d="M256 268 L238 306 Q256 316 274 306 Z"/>
    <!-- cheek notches, so the jaw reads as a jaw and not a block -->
    <path d="M194 292 Q172 310 194 328 Z"/>
    <path d="M318 292 Q340 310 318 328 Z"/>
  </g>
  <g stroke="#141414" stroke-width="9" stroke-linecap="round">
    <line x1="226" y1="340" x2="226" y2="378"/>
    <line x1="246" y1="340" x2="246" y2="378"/>
    <line x1="266" y1="340" x2="266" y2="378"/>
    <line x1="286" y1="340" x2="286" y2="378"/>
  </g>
</svg>
